  // ---------------- 紀錄
  function deltaHtml(d) {
    if (!d) return '';
    const parts = Object.entries(d).map(([k, v]) => `<span class="${v < 0 ? 'neg' : ''}">${k} ${v > 0 ? '+' : '−'}${Math.abs(v)}</span>`);
    return parts.length ? `<div class="delta">${parts.join('')}</div>` : '';
  }

  // 雜報：把史料出處排成一張直行的抄報。報尾偶爾刊一首詩：
  // 只挑那一年已經寫成、而且還是近幾十年的，住在詩裡那個地方的人比較容易讀到；一局裡同一首不登兩次。
  // 挑哪一首只看種子、事件與年份，接續或重播時登的是同一首。
  const GZ = UI.gazette || {};
  let poemSeen = new Set(), poemGame = null;
  function hashStr(str) { let x = 2166136261; for (let i = 0; i < str.length; i++) x = Math.imul(x ^ str.charCodeAt(i), 16777619); return x >>> 0; }
  function poemFor(e) {
    if (poemGame !== game) { poemGame = game; poemSeen = new Set(); }
    const all = (DATA.poems || []).filter((p) => p.year <= e.year && e.year - p.year <= (GZ.window ?? 40) && !poemSeen.has(p.id));
    if (!all.length) return null;
    const hv = hashStr(game.seed + ':' + e.id + ':' + e.year);
    if ((hv % 1000) / 1000 >= (GZ.chance ?? 0.35)) return null;
    const near = all.filter((p) => (p.regions || []).includes(game.state.region));
    const pool = near.length && (hv >>> 10) % 3 ? near : all;
    const p = pool[(hv >>> 12) % pool.length];
    poemSeen.add(p.id);
    return p;
  }
  function gazetteHtml(e) {
    // 「《書名》：引文……《另一本》：引文」切成一段一段，書名用硃筆
    const segs = [];
    const re = /《[^》]+》(?:卷[一二三四五六七八九十百〇]+)?[：:]?/g;
    let m, last = 0, src = '';
    while ((m = re.exec(e.note))) {
      const before = e.note.slice(last, m.index).replace(/^……/, '');
      if (before.trim() && (src || segs.length || before.trim().length > 1)) segs.push({ src, tx: before });
      src = m[0].replace(/[：:]$/, ''); last = re.lastIndex;
    }
    segs.push({ src, tx: e.note.slice(last) });
    const body = segs.filter((g) => g.src || g.tx.trim())
      .map((g) => `<p class="tx">${g.src ? `<span class="src">${esc(g.src)}</span>　` : ''}${esc(g.tx)}</p>`).join('');
    const p = poemFor(e);
    const poem = p ? `<div class="pm"><span><span class="pk">${esc(GZ.poem || '詩')}</span>　<span class="pt">${esc(p.title)}</span>　<span class="pa">${esc(p.author)}</span></span>${p.lines.map((x) => `<span class="pl">${esc(x)}</span>`).join('')}${p.note ? `<span class="pn">${esc(p.note)}</span>` : ''}</div>` : '';
    const date = `${game.eraLabel(e.year)}・${game.ganzhi(e.year)}`;
    return `<details class="gz"${quiet ? '' : ' open'}><summary><span class="gzk">${esc(GZ.head || '雜報')}</span><span class="gzo">${esc(GZ.open || '')}</span><span class="gzf">${esc(GZ.fold || '')}</span></summary>`
      + `<div class="gzs" tabindex="0"><p class="mast">${esc(GZ.head || '雜報')}</p><p class="date">${esc(date)}</p>`
      + `${e.title || e.tag ? `<p class="hl">${esc(e.title || e.tag)}</p>` : ''}${body}${poem}</div></details>`;
  }

  // 接續時把整局紀錄先組在記憶體裡、一次放進頁面，也不播淡入動畫（幾百條同時動畫，慢的手機會卡）
  let renderTarget = null, quiet = false;
  function renderEntry(e) {
    if (e.scene) setScene(e);
    const log = renderTarget || $('#log');
    const fade = quiet ? '' : ' fadein';
    if (e.type === 'heir') {
      log.append(h('div', 'heirline' + fade, esc(e.text)));
      return;
    }
    if (e.type === 'chapter') {
      log.append(h('div', 'chap' + fade, esc(e.text)));
      return;
    }
    if (e.type === 'year') {
      const s = game.state;
      log.append(h('div', 'yr' + fade, `<span class="a">${e.age}歲</span><span class="e">${esc(e.era)}・${esc(e.ganzhi)}・${e.year}</span>`));
      return;
    }
    if (e.type === 'decision' || e.type === 'event' || e.type === 'note' || e.type === 'bond' || e.type === 'choice') {
      if (e.age !== lastAge && e.type !== 'choice' && log.children.length === 0) {
        log.append(h('div', 'yr', `<span class="a">${e.age}歲</span><span class="e">${esc(game.eraLabel(e.year))}・${esc(game.ganzhi(e.year))}・${e.year}</span>`));
      }
      lastAge = e.age;
      let cls = 'en' + fade;
      if (e.kind === 'anchor' || e.kind === 'bond' || e.type === 'decision') cls += ' big';
      if (e.death) cls += ' death';
      if (e.type === 'choice') cls += ' choice';
      if (e.type === 'bond') cls += ' bond';
      let html = '';
      if (e.tag && e.type !== 'choice') html += `<span class="tag">${esc(e.tag)}</span>`;
      if (e.type === 'choice') html += `<p>${e.title ? esc(e.title) + '｜' : ''}你選了<b>「${esc(e.text)}」</b></p>`;
      else html += `<p>${esc(e.text)}</p>`;
      html += deltaHtml(e.delta);
      if (e.note) html += gazetteHtml(e);
      log.append(h('div', cls, html));
    }
  }

  // 播放節奏（參考《江湖千萬人》）：一條一條出，年紀標題跟著當年的第一條一起出；
  // 每條依自己的字數停一下：0.6 秒＋前 40 字每字 0.04 秒、之後每字 0.02 秒，最長 6 秒
  const lineMs = (chars) => Math.min(6000, 600 + Math.min(chars, 40) * 40 + Math.max(0, chars - 40) * 20) / speed;
  const textLen = (e) => (e.type === 'year' || !e.text ? 0 : e.text.length + (e.title ? e.title.length : 0));
  // 唯一的計時器：記住下一步要做什麼，暫停、換速度時才能接著做
  let nextFn = null, nextChars = 0;
  function later(fn, chars) {
    clearTimeout(timer);
    nextFn = fn; nextChars = chars;
    timer = setTimeout(() => { nextFn = null; fn(); }, lineMs(chars));
  }
  function stopLater() { clearTimeout(timer); nextFn = null; }
  // 一次全部顯示（出生、接班、換章、接續）
  let lastChars = 0;
  function flush(entries) {
    lastChars = 0;
    for (const e of entries) lastChars += textLen(e);
    for (const e of entries) renderEntry(e);
    renderHud();
    const p = game.pending;
    if (p) renderDecision(p);
    if (!game.pending && !game.ended) scrollEnd();
  }
  // 章末：人還活著，就不跳出結算頁。在紀錄裡放一張章末卡（照樣收進圖鑑），然後直接往下一章活
  // 回傳章末卡的字數，讓下一步照字數停一下
  function passChapter() {
    const e = game.interlude, s = game.state;
    const fresh = markSeen(e.id);
    markBonds(s.bonds || {});
    markArcs(s);
    const tags = [e.chapterTitle || '', '章末', e.rare ? '稀有' : '', fresh ? '初見' : ''].filter(Boolean).join('・');
    const world = (e.epilogue || []).map((t) => `<p class="w">${esc(t)}</p>`).join('');
    $('#log').append(h('div', 'chap-end fadein', `<span class="k ui">${esc(tags)}</span><b>「${esc(e.title)}」</b><p>${esc(e.text)}</p>${world}`));
    record(['n']);
    return (e.title + e.text + (e.epilogue || []).join('')).length;
  }
  // 停在章末的時候：還有下一章就自動接下去；沒有了才出結算頁
  function goOnChapter() {
    if (!game.interlude.next) return showEnd(true);
    const chars = passChapter();
    scrollEnd();
    const next = game.continueChapter();
    later(() => reveal(next), chars);
  }

  // 一條一條顯示；都出完了再看要結局、抉擇，還是排下一年
  function reveal(entries) {
    const list = entries.slice();
    const nextLine = () => {
      const batch = [];
      while (list.length) { const e = list.shift(); batch.push(e); if (e.type !== 'year' && e.type !== 'chapter' && e.type !== 'heir') break; }
      for (const e of batch) renderEntry(e);
      renderHud();
      const chars = batch.reduce((n, e) => n + textLen(e), 0);
      if (list.length) { scrollEnd(); return later(nextLine, chars); }
      afterReveal(chars);
    };
    nextLine();
  }
  function afterReveal(chars) {
    if (game.ended) return showEnd();
    if (game.succession) return showEnd('heir');
    if (game.interlude) return goOnChapter();
    if (game.pending) return renderDecision(game.pending);
    scrollEnd();
    later(tick, chars);
  }

  function scrollEnd() {
    const el = $('#log').lastElementChild;
    if (el) el.scrollIntoView({ block: 'end', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  // ---------------- 抉擇
  function renderDecision(p) {
    const card = h('div', 'dec fadein');
    card.id = 'decision';
    const who = p.who ? `<span class="who">人物　<b>${esc(p.who)}</b></span>` : '';
    card.append(h('div', 'head', `<h3>${esc(p.title || p.tag || '抉擇')}</h3>${who}`));
    const opts = h('div', 'opts');
    p.opts.forEach((o, idx) => {
      const b = h('button', 'opt', `<span class="n">${idx + 1}</span><span class="t">${esc(o.t)}</span><span class="s">${esc(o.ok ? (o.sub || '') : (o.lock || '條件不足'))}</span>`);
      b.type = 'button';
      b.disabled = !o.ok;
      b.addEventListener('click', () => pick(idx));
      opts.append(b);
    });
    card.append(opts);
    if (fate) card.append(h('div', 'auto-hint', '交給天命中：稍後會自動替你選一條路。點任何選項可以自己決定。'));
    $('#log').append(card);
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const first = card.querySelector('.opt:not(:disabled)');
    if (first && !fate) first.focus({ preventScroll: true });
    if (fate) later(() => { const ok = p.opts.map((o, i) => (o.ok ? i : -1)).filter((i) => i >= 0); pick(ok[Math.floor(Math.random() * ok.length)]); }, (p.text || '').length + p.opts.reduce((n, o) => n + o.t.length, 0));
  }

  function pick(idx) {
    const card = $('#decision');
    if (card) card.remove();
    stopLater();
    record(['c', idx]);
    reveal(game.choose(idx));
  }

  document.addEventListener('keydown', (ev) => {
    if (!game || !game.pending || !$('#decision')) return;
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= game.pending.opts.length && game.pending.opts[n - 1].ok) pick(n - 1);
  });

  // ---------------- 推進
  // 繼續往下走：剛才停在哪一步（暫停、換速度），就從那一步接著做
  function schedule() {
    if (paused || !game || game.ended || game.interlude || game.succession) { clearTimeout(timer); return; }
    if (nextFn) return later(nextFn, nextChars);
    if (game.pending) return;
    later(tick, lastChars);
  }
  function tick() {
    if (!game || game.pending || game.ended || game.interlude || game.succession || paused) return;
    reveal(game.step());
  }

  $('#btnPause').addEventListener('click', (ev) => {
    paused = !paused;
    ev.currentTarget.setAttribute('aria-pressed', String(paused));
    ev.currentTarget.textContent = paused ? '繼續' : '暫停';
    if (!paused) schedule(); else clearTimeout(timer); // 暫停只停計時器，下一步記在 nextFn
  });
  document.querySelectorAll('.spd').forEach((b) => {
    b.setAttribute('aria-pressed', String(+b.dataset.s === speed));
    b.addEventListener('click', () => {
      pref(PFX + 'tips', '1'); // 會用控制列的人，就不必再看新手提示了
      speed = +b.dataset.s; pref(PFX + 'speed', String(speed));
      document.querySelectorAll('.spd').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      if (!paused) schedule();
    });
  });
  $('#btnFate').addEventListener('click', (ev) => {
    pref(PFX + 'tips', '1');
    fate = !fate;
    ev.currentTarget.setAttribute('aria-pressed', String(fate));
    if (game && !game.pending && !paused) schedule(); // 第一局還停在新手提示時，按交給天命也就開始了
    // 抉擇卡還在的時候切換：重畫一次（開了就排上自動選，關了就取消已經排好的自動選）
    if (game && game.pending && $('#decision')) { stopLater(); $('#decision').remove(); renderDecision(game.pending); }
  });

  // ---------------- 結局
  // 家譜裡換過姓（女兒接班、入贅）就寫「秦家到周家」，不然只寫最後一位的姓會像是整家都姓周
  function houses(s, L) {
    const sur = (L || []).map((p) => p.name[0]);
    const before = sur.filter((x, i) => x !== s.surname && sur.indexOf(x) === i);
    return before.length ? before.map((x) => x + '家').join('、') + `到${s.surname}家` : `${s.surname}家`;
  }
  function familyText(s, e) {
    const L = [`《${UI.title}》${houses(s, e.lineage)}的故事`, ''];
    for (const p of e.lineage || []) { L.push(`第${cnGen(p.gen)}代　${p.name}（${p.born}–${p.died ?? ''}${p.died ? `，${p.age}歲` : ''}）「${p.title}」`); if (p.memo) L.push('　　' + p.memo); }
    if (s.chapterEndings && s.chapterEndings.length) {
      L.push('', '走過的章：');
      for (const c of s.chapterEndings) L.push(`第${c.chapter}章・${c.name}「${c.title}」`);
    }
    L.push('', `結局「${e.title}」：${e.text}`);
    if (e.memories && e.memories.length) { L.push('', '往事：'); for (const m of e.memories) L.push('・' + m); }
    return L.join('\n');
  }

  // ---------------- 分享圖：把結局畫成一張 1080×1080 的卡片，顏色跟著目前的底色
  function wrapText(ctx, text, maxW) {
    const NO_HEAD = '，。、；：！？」』）》…—';
    const lines = []; let cur = '';
    for (const ch of [...text]) {
      if (ctx.measureText(cur + ch).width > maxW && cur && !NO_HEAD.includes(ch)) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function drawLines(ctx, lines, x, y, lh, max) {
    const out = lines.slice(0, max);
    if (lines.length > max) out[max - 1] = out[max - 1].slice(0, -1) + '…';
    out.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
    return y + out.length * lh;
  }
  async function shareCard(s, e, kicker) {
    const css = getComputedStyle(document.documentElement);
    const C = (k) => css.getPropertyValue(k).trim();
    const col = { bg: C('--bg'), slip: C('--slip'), ink: C('--ink'), muted: C('--muted'), line: C('--line'), red: C('--red'), yellow: C('--yellow') };
    const SERIF = '"Noto Serif TC", "Songti TC", "PMingLiU", serif';
    const SANS = 'system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif';
    const L = e.lineage || [];
    const gender = s.gender === 'm' ? '男' : '女';
    const detail = `${s.name}，${gender}，${s.birthYear}年生於${s.regionName}，${s.clsName}。` +
      (e.alive ? `${s.year}年時${s.age}歲，還活著。` : `卒於${s.year}年，享年${s.age}歲。`);
    const fam = L.length > 1
      ? `${houses(s, L)}${cnGen(s.generation - (L[0].gen || 1) + 1)}代人，從${L[0].born}年走到${s.year}年：${L.slice(-5).map((p) => p.name).join(' → ')}`
      : `第${cnGen(s.generation)}代當家・${s.surname}家`;
    const all = e.title + kicker + s.name + e.text + detail + fam + e.cause + (UI.shareChars || '');
    try { await Promise.race([Promise.all([document.fonts.load(`900 80px ${SERIF}`, all), document.fonts.load(`400 30px ${SERIF}`, all)]), new Promise((r) => setTimeout(r, 2500))]); } catch (err) { /* 字型載不到就用系統字 */ }

    const W = 1080, H = 1080, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const x = cv.getContext('2d');
    x.fillStyle = col.bg; x.fillRect(0, 0, W, H);
    // 外框與四角
    x.strokeStyle = col.muted; x.lineWidth = 2; x.strokeRect(40, 40, W - 80, H - 80);
    x.strokeStyle = col.line; x.lineWidth = 1; x.strokeRect(54, 54, W - 108, H - 108);
    x.strokeStyle = col.muted; x.lineWidth = 3;
    for (const [cx, cy, dx, dy] of [[64, 64, 1, 1], [W - 64, 64, -1, 1], [64, H - 64, 1, -1], [W - 64, H - 64, -1, -1]]) {
      x.beginPath(); x.moveTo(cx, cy + 36 * dy); x.lineTo(cx, cy); x.lineTo(cx + 36 * dx, cy); x.stroke();
    }
    // 左邊的印：結局標題直排
    const chars = [...e.title].slice(0, 7);
    const fs = Math.min(96, Math.floor(600 / chars.length));
    const sw = fs + 56, sh = chars.length * (fs * 1.1) + 64, sx = 96, sy = 130;
    x.save(); x.translate(sx + sw / 2, sy + sh / 2); x.rotate(-0.025); x.translate(-sw / 2, -sh / 2);
    x.fillStyle = e.alive ? col.ink : col.red; x.fillRect(0, 0, sw, sh);
    x.strokeStyle = col.slip; x.lineWidth = 3; x.strokeRect(10, 10, sw - 20, sh - 20);
    x.fillStyle = col.slip; x.font = `900 ${fs}px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    chars.forEach((c, i) => x.fillText(c, sw / 2, 32 + fs * 0.55 + i * fs * 1.1));
    x.restore();
    // 右欄
    const rx = sx + sw + 50, rw = W - 90 - rx;
    x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    let y = 160;
    x.fillStyle = col.red; x.font = `400 28px ${SANS}`; x.fillText(kicker, rx, y);
    y += 92;
    x.fillStyle = col.ink; x.font = `900 84px ${SERIF}`;
    let nameW = x.measureText(s.name).width;
    x.fillText(s.name, rx, y);
    x.font = `900 50px ${SERIF}`; x.fillText(` ${s.age}歲`, rx + nameW, y);
    y += 70;
    x.font = `400 36px ${SERIF}`; x.fillStyle = col.ink;
    y = drawLines(x, wrapText(x, e.text, rw), rx, y, 58, 6) + 10;
    x.font = `400 27px ${SERIF}`; x.fillStyle = col.muted;
    y = drawLines(x, wrapText(x, detail, rw), rx, y, 44, 3) + 20;
    // 框：死因或家族
    const boxLines = [];
    x.font = `400 27px ${SERIF}`;
    if (!e.alive && e.cause) boxLines.push(['死因', e.cause]);
    boxLines.push(['家族', fam]);
    const wrapped = boxLines.map(([k, v]) => [k, wrapText(x, v, rw - 150).slice(0, 2)]);
    const bh = 30 + wrapped.reduce((n, [, ls]) => n + ls.length * 42, 0) + 14;
    x.fillStyle = col.slip; x.fillRect(rx, y, rw, bh);
    let by = y + 52;
    for (const [k, ls] of wrapped) {
      x.fillStyle = col.red; x.font = `900 30px ${SERIF}`; x.fillText(k, rx + 26, by);
      x.fillStyle = col.ink; x.font = `400 27px ${SERIF}`;
      ls.forEach((l, i) => x.fillText(l, rx + 120, by + i * 42));
      by += ls.length * 42;
    }
    // 數值不畫上去：死的時候「健」還很高之類的數字，放在結局卡上反而突兀
    // 頁尾
    x.textAlign = 'center';
    x.fillStyle = col.ink; x.font = `900 52px ${SERIF}`; x.fillText(UI.title, W / 2, H - 170);
    x.fillStyle = col.muted; x.font = `400 26px ${SERIF}`; x.fillText(UI.shareFoot || '', W / 2, H - 122);
    x.fillStyle = col.red; x.font = `900 22px ${SERIF}`; x.fillText(UI.shareSource || '', W / 2, H - 84);
    return cv;
  }
  // 第幾代：跟遊戲裡「第五代　余貞」的寫法一致，用中文數字
  function cnGen(n) { return n <= 10 ? CN[n] : n < 20 ? '十' + CN[n % 10] : String(n); }
  // 家譜的一行：名字、生卒、結局，底下一句這一代最難忘的往事
  function treeRow(p) {
    return h('div', null, `<span class="g">第${cnGen(p.gen)}代</span><span><b>${esc(p.name)}</b>　${p.born}–${p.died ?? ''}${p.died ? `，${p.age}歲` : ''}　「${esc(p.title)}」</span>` +
      (p.memo ? `<span class="memo">${esc(p.memo)}</span>` : ''));
  }

  function openShare(cv, fileName) {
    const url = cv.toDataURL('image/png');
    const ov = h('div', 'share-ov');
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', '分享圖');
    const box = h('div', 'share-box');
    const img = h('img'); img.src = url; img.alt = '這一生的結局卡';
    box.append(img, h('p', 'fine', '手機請長按圖片存下來；電腦請在圖片上按右鍵，選「另存圖片」。如果「下載圖片」按了沒反應（有些分享連結不允許下載），也請用這個方法。'));
    const row = h('div', 'end-actions');
    const dl = h('a', 'ghost ui', '下載圖片'); dl.href = url; dl.download = fileName;
    row.append(dl);
    cv.toBlob((blob) => {
      if (!blob) return;
      // 複製圖片：分享連結不允許下載時，還可以直接貼到聊天軟體
      if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
        const cp = h('button', 'ghost ui', '複製圖片'); cp.type = 'button';
        cp.addEventListener('click', async () => {
          // 有些嵌入的頁面不准寫圖片進剪貼簿，請求會一直沒有回應：三秒沒成功就請玩家改用右鍵或長按
          const timeout = new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 3000));
          try { await Promise.race([navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]), timeout]); cp.textContent = '已複製，可以直接貼上'; }
          catch (err) { cp.textContent = '這裡不能複製，請用右鍵或長按'; }
          setTimeout(() => { cp.textContent = '複製圖片'; }, 2500);
        });
        dl.after(cp);
      }
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        const sh = h('button', 'cta', '分享'); sh.type = 'button';
        sh.addEventListener('click', () => navigator.share({ files: [file], title: UI.title }).catch(() => {}));
        row.prepend(sh);
      }
    }, 'image/png');
    const close = h('button', 'ghost ui', '關閉'); close.type = 'button';
    const done = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (ev) => { if (ev.key === 'Escape') done(); };
    close.addEventListener('click', done);
    ov.addEventListener('click', (ev) => { if (ev.target === ov) done(); });
    document.addEventListener('keydown', onKey);
    row.append(close);
    box.append(row);
    ov.append(box);
    document.body.append(ov);
    close.focus({ preventScroll: true });
  }

  function showEnd(mode) {
    stopLater();
    let afterAct = null;
    const heirMode = mode === 'heir';
    const interlude = mode === true;
    const s = game.state, e = heirMode ? game.succession : interlude ? game.interlude : game.ended;
    const lastSave = save; // 回饋要附存檔碼：家族結束時存檔會被清掉，先留一份
    if (!heirMode && !interlude) clearSave(); // 這一家的故事說完了
    const fresh = markSeen(e.id);
    markBonds(s.bonds || {});
    const freshArcs = markArcs(s);
    $('#ctrl').hidden = true;
    const sec = $('#end');
    sec.innerHTML = '';
    const sealText = e.title.length > 6 ? e.title.slice(0, 6) : e.title;
    const head = h('div', 'end-head fadein');
    head.append(h('div', 'seal' + (e.alive ? ' alive' : ''), esc(sealText)));
    const chName = (e.chapterTitle || '').replace(/^\S+\s+/, '');
    const life = e.alive ? `${s.birthYear}年生，${interlude ? '這一章結束時' : '活到'} ${s.age} 歲` : `${s.birthYear}–${s.year}，享年 ${s.age} 歲，${esc(e.cause || '')}`;
    const first = fresh ? '・初見' : '';
    const kicker = interlude ? `<span class="rare">${esc(e.chapterTitle || '')}・章末${e.rare ? '・稀有' : ''}${first}</span>`
      : heirMode ? `<span class="rare">第${cnGen(s.generation)}代・一生${e.rare ? '・稀有' : ''}${first}</span>`
      : (e.rare || fresh ? `<span class="rare">${e.rare ? '稀有結局' : '結局'}${first}</span>` : '');
    head.append(h('div', 'end-body', `${kicker}<h2>${esc(s.name)}</h2><div class="epi">${esc(s.regionName)}・${esc(s.clsName)}・${life}</div><p>${esc(e.text)}</p>`));
    sec.append(head);

    const st = h('div', 'end-sec');
    st.append(h('h4', null, '最後的樣子'));
    st.append(h('div', 'delta', STAT_ORDER.map((k) => `<span style="color:var(--ink)">${k} ${s.stats[k]}</span>`).join('') + `<span style="color:var(--ink)">${esc(HP)} ${s.hp}</span>` + (s.route ? `<span style="color:var(--ink)">${esc(tplU(UI.routeEnd, { label: DATA.world.routeLabel || '', route: ROUTE_NAME[s.route] || s.route }))}</span>` : '')));
    sec.append(st);

    const extinct = !heirMode && !interlude && e.extinct;
    const mem = e.memories || [];
    if (e.after.length || e.epilogue.length || mem.length || extinct) {
      const af = h('div', 'end-sec');
      af.append(h('h4', null, interlude ? '這時候，天下的另一頭' : e.alive ? '後來' : '你走之後'));
      const box = h('div', 'after');
      for (const a of e.after) box.append(h('div', 'card', `<b>${esc(a.who)}</b><small>${esc(a.tier)}</small><p style="margin:4px 0 0">${esc(a.text)}</p>`));
      // 往事：先放三件，其餘收起來
      const SHOW = 3;
      for (const t of mem.slice(0, SHOW)) box.append(h('div', 'card memory', `<p style="margin:0">${esc(t)}</p>`));
      if (mem.length > SHOW) {
        const more = h('details', 'more');
        more.append(h('summary', 'ui', `還有 ${mem.length - SHOW} 件往事`));
        for (const t of mem.slice(SHOW)) more.append(h('div', 'card memory', `<p style="margin:0">${esc(t)}</p>`));
        box.append(more);
      }
      if (freshArcs.length) box.append(h('p', 'fine arc-new', `結局冊收進新的人生故事：${freshArcs.map((it) => esc(it.arc) + '・' + esc(it.title)).join('、')}`));
      // 天下的收尾放最後，永遠看得見
      if (extinct) box.append(h('div', 'card', `<p style="margin:0">${esc(UI.extinct || '')}</p>`));
      for (const t of e.epilogue) box.append(h('div', 'card world', `<p style="margin:0">${esc(t)}</p>`));
      af.append(box);
      sec.append(af);
    }

    if (s.choices.length) {
      const tl = h('div', 'end-sec');
      tl.append(h('h4', null, '這一生的抉擇'));
      const list = h('div', 'tl');
      for (const c of s.choices) list.append(h('div', null, `<span class="y">${c.age}歲</span><span>${esc(c.title)}：<b>${esc(c.pick)}</b></span>`));
      tl.append(list);
      sec.append(tl);
    }

    // 家譜
    if ((e.lineage || []).length > 1 || heirMode) {
      const tr = h('div', 'end-sec');
      tr.append(h('h4', null, '家譜'));
      const t = h('div', 'tree');
      for (const p of e.lineage || []) t.append(treeRow(p));
      tr.append(t);
      sec.append(tr);
    }
    const act = h('div', 'end-actions');
    if (heirMode) {
      const hs = h('div', 'heirs');
      hs.append(h('h4', null, '由誰接下這個家'));
      e.heirs.forEach((x, i) => {
        const b = h('button', i === 0 ? 'cta' : 'ghost ui', `${esc(x.rel)}　${esc(x.name)}（${x.age}歲${x.via ? `，${esc(x.via)}的孩子` : ''}${x.house ? '，已經當家' : ''}）`);
        b.type = 'button';
        b.addEventListener('click', () => {
          sec.hidden = true; $('#ctrl').hidden = false;
          record(['h', i]);
          if (save) { save.name = x.name; persist(); }
          flush(game.continueAsHeir(i));
          if (game.interlude) return goOnChapter();
          if (game.ended) return showEnd();
          schedule();
        });
        hs.append(b);
      });
      const hsec = h('div', 'end-sec');
      hsec.append(hs);
      sec.append(hsec);
    }
    if (interlude && e.next) {
      const go = h('button', 'cta', '繼續活下去'); go.type = 'button';
      go.title = e.next.title;
      go.addEventListener('click', () => {
        sec.hidden = true; $('#ctrl').hidden = false;
        record(['n']);
        flush(game.continueChapter());
        schedule();
      });
      act.append(go, h('span', 'fine', esc(e.next.title)));
    }
    if (!interlude && s.chapterEndings && s.chapterEndings.length > 1) {
      st.append(h('div', 'fine', '這一家走過的章：' + s.chapterEndings.map((c) => `第${c.chapter}章${c.name ? '・' + esc(c.name) : ''}「${esc(c.title)}」`).join('　')));
    }
    const again = h('button', interlude || heirMode ? 'ghost ui' : 'cta', '再投一次胎'); again.type = 'button'; again.addEventListener('click', start);
    const back = h('button', 'ghost ui', '回到這一生的紀錄'); back.type = 'button'; back.addEventListener('click', () => $('#log').scrollIntoView({ behavior: 'smooth' }));
    act.append(again, back);
    // 分享圖：每一生的結局都可以存成一張圖
    const card = h('button', 'ghost ui', '產生分享圖'); card.type = 'button';
    card.addEventListener('click', async () => {
      card.disabled = true; card.textContent = '畫圖中…';
      const plain = (kicker.replace(/<[^>]+>/g, '') || (e.rare ? '稀有結局' : '結局')).replace(/&amp;/g, '&');
      try { openShare(await shareCard(s, e, plain), `${UI.title}_${s.name}_${e.title}.png`); }
      finally { card.disabled = false; card.textContent = '產生分享圖'; }
    });
    act.append(card);
    afterAct = feedbackButtons(e, lastSave);
    // 最終結局：把這一家的故事整理成一段文字，方便分享
    if (!interlude && !heirMode) {
      const share = h('button', 'ghost ui', '複製這一家的故事'); share.type = 'button';
      share.addEventListener('click', async () => {
        const text = familyText(s, e);
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch (err) {
          const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.append(ta); ta.select();
          try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
          ta.remove();
        }
        share.textContent = ok ? '已複製' : '複製失敗，請手動選取';
        setTimeout(() => { share.textContent = '複製這一家的故事'; }, 2000);
      });
      act.append(share);
    }
    sec.append(act);
    if (afterAct) sec.append(afterAct);
    sec.hidden = false;
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();
</script>
