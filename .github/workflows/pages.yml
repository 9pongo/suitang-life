# 每次推送到 main：先跑稽核與打包（稽核有錯誤就不會產生檔案），再把完整網頁版發佈到 GitHub Pages
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 稽核與打包
        run: node build.js
      - name: 準備網站
        # dev.html 有完整的 doctype、charset、viewport，當作首頁；index.html 是給 Claude Artifact 用的版本
        run: |
          mkdir -p _site
          cp dist/dev.html _site/index.html
          if [ -f dist/cover.png ]; then cp dist/cover.png _site/cover.png; fi
          if [ -d dist/music ]; then cp -r dist/music _site/music; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
